<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<th:block th:replace="fragments/common::header-meta"></th:block>

    <!-- common import of css & js goes here -->
    <th:block th:replace="fragments/common::header-import-css"></th:block>
    <th:block th:replace="fragments/common::header-import-js"></th:block>

	<!-- FullCalendar (bundled with the Limitless theme) -->
	<link th:href="@{/global_assets/js/plugins/ui/fullcalendar/core/main.min.css}" rel="stylesheet" type="text/css">
	<link th:href="@{/global_assets/js/plugins/ui/fullcalendar/daygrid/main.min.css}" rel="stylesheet" type="text/css">
	<link th:href="@{/global_assets/js/plugins/ui/fullcalendar/list/main.min.css}" rel="stylesheet" type="text/css">
	<script th:src="@{/global_assets/js/plugins/ui/fullcalendar/core/main.min.js}"></script>
	<script th:src="@{/global_assets/js/plugins/ui/fullcalendar/daygrid/main.min.js}"></script>
	<script th:src="@{/global_assets/js/plugins/ui/fullcalendar/list/main.min.js}"></script>

	<title>Human Resource Information System</title>
</head>

<body>

	<!-- Main Navbar -->
	<div th:replace="fragments/common::main-navbar"></div>
	<!-- /Main Navbar -->

	<!-- Page content -->
	<div class="page-content">

		<!-- Main sidebar -->
		<div th:replace="fragments/common::main-sidebarnav"></div>
		<!-- /Main sidebar -->

		<!-- Main content -->
		<div class="content-wrapper">

			<!-- Content area -->
			<div class="content pt-0">

				<div class="row">
					<div class="col-xl-12">
						<div class="card p-3">
							<div class="card-header header-elements-inline bg-primary">
								<h6 class="card-title">Leave Tracker — Employees on Approved Leave</h6>
							</div>
							<div class="card-body">
								<p class="text-muted mb-2">
									Approved leaves appear on the calendar. Click an entry to open the employee's leave record.
								</p>
								<div id="leave_calendar"></div>
							</div>
						</div>
					</div>
				</div>

			</div>
			<!-- /content area -->

			<!-- Footer -->
			<div th:replace="fragments/common::footer"></div>
			<!-- /Footer -->

		</div>
		<!-- /main content -->

	</div>
	<!-- /page content -->

	<script th:inline="javascript">
		let contextRoot = /*[[${#httpServletRequest.getContextPath()}]]*/ '';
		const leaveEvents = /*[[${leaveEvents}]]*/ [];

		$(document).ready(function() {

			$(".nav-item-submenu").removeClass("nav-item-expanded nav-item-open");
			$("#employeeManagementNav").addClass("nav-item-expanded nav-item-open");
			$("#leaveTrackerNav").addClass("active");

			leaveEvents.forEach(function(e) { e.url = contextRoot + e.url; });

			const calendarEl = document.getElementById('leave_calendar');
			const calendar = new FullCalendar.Calendar(calendarEl, {
				plugins: ['dayGrid', 'list'],
				header: {
					left: 'prev,next today',
					center: 'title',
					right: 'dayGridMonth,listMonth'
				},
				defaultView: 'dayGridMonth',
				events: leaveEvents,
				eventColor: '#26A69A',
				height: 'auto'
			});
			calendar.render();
		});
	</script>
</body>
</html>
