<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<th:block th:replace="fragments/common::header-meta"></th:block>

    <!-- common import of css & js goes here -->
    <th:block th:replace="fragments/common::header-import-css"></th:block>
    <th:block th:replace="fragments/common::header-import-js"></th:block>

	<title>Human Resource Information System</title>


</head>

<body>

	<!-- Main Navbar -->
	<div th:replace="fragments/common::main-navbar"></div>
	<!-- /Main Navbar -->


	<!-- Page content -->
	<div class="page-content">

		<!-- Main sidebar -->
		<div th:replace="fragments/common::main-sidebarnav"></div>
		<!-- /Main sidebar -->


		<!-- Main content -->
		<div class="content-wrapper">

			<!-- Page header -->
			<div class="page-header">
				<div class="page-header-content header-elements-md-inline">
					<div class="page-title d-flex">
						<h4><span class="font-weight-semibold">Appointment Status List</span></h4>
						<a href="#" class="header-elements-toggle text-default d-md-none"><i class="icon-more"></i></a>
					</div>
				</div>
			</div>
			<!-- /page header -->


			<!-- Vertical form modal -->
			<div id="modal_form_vertical" class="modal fade" tabindex="-1" >
				<div class="modal-dialog">
					<div class="modal-content">
						<div class="modal-header bg-primary">
							<h5 class="modal-title">Appointment Status Details</h5>
							<button type="button" class="close" data-dismiss="modal">&times;</button>
						</div>
                        <!-- POST MAPPING CONTROLLER -->
						<form th:action="@{/save-appointment-status}" method="post" class="form-horizontal" th:object="${appointmentStatus}">
							<input type="hidden" th:field="*{id}" id="id"/>
							<div class="modal-body">
								<div class="form-group row">
									<label class="col-form-label col-sm-4">Appointment Status Name</label>
									<div class="col-sm-8">
										<span class="validationError text-danger" th:if="${#fields.hasErrors('appointmentStatusName')}" th:errors="*{appointmentStatusName}"></span>
										<input type="text" id="appointmentStatusName" th:field="*{appointmentStatusName}" placeholder="Appointment Status Name" class="form-control">

									</div>
								</div>
							</div>

							<div class="modal-footer">
								<button type="button" class=" btnClose btn btn-link" data-dismiss="modal">Close</button>
								<button type="submit" class="btn bg-primary">Submit</button>
							</div>
						</form>
					</div>
				</div>
			</div>
			<!-- /Vertical form modal -->

			<!-- Hidden form for delete POST -->
			<form id="deleteAppointmentStatusForm" th:action="@{/delete-appointment-status/0}" method="post"></form>

			<!-- Content area -->
			<div class="content pt-0">

				<!-- Dashboard content -->
				<div class="row">
					<div class="col-xl-12">
						<!-- Basic datatable -->
						<div class="card p-3">
							<div class="card-header header-elements-inline">
								<h5 class="card-title">Appointment Status List</h5>
								<div class="header-elements">
									<div class="list-icons">
				                		<button type="button" class="btn btn-outline-primary" data-toggle="modal" data-target="#modal_form_vertical">Add Record</button>
				                	</div>
			                	</div>
							</div>


							<table class="table table-basic table-hover" id="table-list">
								<thead>
									<tr>
										<th>Appointment Status Name</th>
										<th class="text-center">Actions</th>
									</tr>
								</thead>
								<tbody>
									<th:block th:each="appointmentStatus : ${listOfAppointmentStatus}">
										<tr>
											<td id="appointmentStatusName" th:text="${appointmentStatus.getAppointmentStatusName()}"></td>
											<td class="text-center" width="250px;">
												<button id="editDegreeLevelButton" type="button" class="showDetails btn btn-primary"
                                                 th:data-row-appointmentStatusName="${appointmentStatus.getAppointmentStatusName()}"
                                                 th:data-row-id="${appointmentStatus.getId()}"
												data-toggle="modal" data-target="#modal_form_vertical"
                                                >View Record</button>
												<button type="button" class="btn btn-danger btn-sm ml-1" th:attr="onclick='confirmDeleteAppointmentStatus(' + ${appointmentStatus.getId()} + ');'">
													<i class="icon-trash"></i> Delete
												</button>
											</td>
										</tr>
									</th:block>
								</tbody>
							</table>
						</div>
						<!-- /basic datatable -->
					</div>
				</div>
				<!-- /dashboard content -->

			</div>
			<!-- /content area -->

			<!-- Footer -->
			<div th:replace="fragments/common::footer"></div>
			<!-- /Footer -->

		</div>
		<!-- /main content -->

	</div>
	<!-- /page content -->

	<script th:inline="javascript">

		let contextRoot = /*[[${#httpServletRequest.getContextPath()}]]*/ '';

		$(document).ready(function() {
			//$(".nav-link").removeClass("active");
			//$("#academicHonorsNav").addClass("active");

			$(".nav-item-submenu").removeClass("nav-item-expanded nav-item-open");
			$("#systemSettingsNav").addClass("nav-item-expanded nav-item-open");
			$("#appointmentStatusNav").addClass("active");


			let msgCode = /*[[${uxmessage == null ? '' : uxmessage.code} ]]*/'';
			let msgDesc = /*[[${uxmessage == null ? '' : uxmessage.message}]]*/'';

			if(msgCode === 'ERROR'){
				$('#modal_form_vertical').modal('show');
				notifyError(msgDesc);
			} else if (msgCode === 'SUCCESS') {
				notifySuccess(msgDesc);
			}


		});

		$('#table-list').DataTable({
				"lengthMenu": [10, 25, 50],
				"ordering": false,
		});

		$(document).on("click", ".showDetails", function() {
            var id = $(this).attr('data-row-id');
            var appointmentStatusName = $(this).attr('data-row-appointmentStatusName');

            $("#modal_form_vertical").find("#id").val(id);
            $("#modal_form_vertical").find("#appointmentStatusName").val(appointmentStatusName);
        });

        function confirmDeleteAppointmentStatus(id) {
            swal({
                title: 'Delete Appointment Status',
                text: 'Are you sure you want to delete this record? This cannot be undone.',
                icon: 'warning',
                buttons: { cancel: 'Cancel', confirm: { text: 'Delete', value: true } },
                dangerMode: true,
            }).then(function(value) {
                if (value) {
                    var form = document.getElementById('deleteAppointmentStatusForm');
                    form.action = contextRoot + '/delete-appointment-status/' + id;
                    form.submit();
                }
            });
        }

	</script>
</body>
</html>
