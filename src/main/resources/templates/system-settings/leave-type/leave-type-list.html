<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<th:block th:replace="fragments/common::header-meta"></th:block>
    <th:block th:replace="fragments/common::header-import-css"></th:block>
    <th:block th:replace="fragments/common::header-import-js"></th:block>
	<title>Human Resource Information System</title>
</head>

<body>

	<!-- Main Navbar -->
	<div th:replace="fragments/common::main-navbar"></div>

	<!-- Page content -->
	<div class="page-content">

		<!-- Main sidebar -->
		<div th:replace="fragments/common::main-sidebarnav"></div>

		<!-- Main content -->
		<div class="content-wrapper">

			<!-- Page header -->
			<div class="page-header">
				<div class="page-header-content header-elements-md-inline">
					<div class="page-title d-flex">
						<h4>
							<span class="font-weight-semibold">Leave Types</span>
							<small class="d-block">Types selectable on CS Form No. 6 (6.A)</small>
						</h4>
						<a href="#" class="header-elements-toggle text-default d-md-none"><i class="icon-more"></i></a>
					</div>
				</div>
			</div>
			<!-- /page header -->

			<!-- Add/Edit modal -->
			<div id="modal_form_vertical" class="modal fade" tabindex="-1">
				<div class="modal-dialog">
					<div class="modal-content">
						<div class="modal-header bg-primary">
							<h5 class="modal-title">Leave Type Details</h5>
							<button type="button" class="close" data-dismiss="modal">&times;</button>
						</div>
						<form th:action="@{/save-leave-type}" method="post" class="form-horizontal" th:object="${leaveType}">
							<input type="hidden" th:field="*{id}" id="id"/>
							<div class="modal-body">
								<div class="form-group row">
									<label class="col-form-label col-sm-4" for="leaveTypeName">Leave Type Name</label>
									<div class="col-sm-8">
										<span class="validationError text-danger" th:if="${#fields.hasErrors('leaveTypeName')}" th:errors="*{leaveTypeName}"></span>
										<input type="text" id="leaveTypeName" th:field="*{leaveTypeName}" placeholder="e.g. Vacation Leave" class="form-control">
									</div>
								</div>
								<div class="form-group row">
									<label class="col-form-label col-sm-4" for="legalBasis">Legal Basis <small class="text-muted d-block">optional</small></label>
									<div class="col-sm-8">
										<input type="text" id="legalBasis" th:field="*{legalBasis}" placeholder="e.g. Sec. 51, Rule XVI, E.O. No. 292" class="form-control">
									</div>
								</div>
								<div class="form-group row mb-0">
									<label class="col-form-label col-sm-4" for="isActive">Selectable</label>
									<div class="col-sm-8">
										<div class="form-check mt-2">
											<label class="form-check-label">
												<input type="checkbox" id="isActive" th:field="*{active}" class="form-check-input">
												Shown in the leave application form
											</label>
										</div>
									</div>
								</div>
							</div>
							<div class="modal-footer">
								<button type="button" class="btnClose btn btn-link" data-dismiss="modal">Close</button>
								<button type="submit" class="btn bg-primary">Submit</button>
							</div>
						</form>
					</div>
				</div>
			</div>
			<!-- /modal -->

			<!-- Hidden form for delete POST -->
			<form id="deleteLeaveTypeForm" th:action="@{/delete-leave-type/0}" method="post"></form>

			<!-- Content area -->
			<div class="content pt-0">
				<div class="row">
					<div class="col-xl-12">
						<div class="card p-3">
							<div class="card-header header-elements-inline">
								<h5 class="card-title">Leave Type List</h5>
								<div class="header-elements">
									<div class="list-icons">
										<button id="addLeaveTypeBtn" type="button" class="btn btn-outline-primary" data-toggle="modal" data-target="#modal_form_vertical">Add Leave Type</button>
									</div>
								</div>
							</div>

							<table class="table table-basic table-hover" id="table-list">
								<thead>
									<tr>
										<th>Leave Type</th>
										<th>Legal Basis</th>
										<th>Selectable</th>
										<th class="text-center">Actions</th>
									</tr>
								</thead>
								<tbody>
									<th:block th:each="ltype : ${listOfLeaveType}">
										<tr>
											<td th:text="${ltype.getLeaveTypeName()}"></td>
											<td class="text-muted" th:text="${ltype.getLegalBasis()}"></td>
											<td>
												<span th:if="${ltype.isActive()}" class="badge badge-success">Yes</span>
												<span th:unless="${ltype.isActive()}" class="badge badge-secondary">Hidden</span>
											</td>
											<td class="text-center" width="220px;">
												<button type="button" class="showDetails btn btn-primary btn-sm"
													th:data-row-id="${ltype.getId()}"
													th:data-row-leaveTypeName="${ltype.getLeaveTypeName()}"
													th:data-row-legalBasis="${ltype.getLegalBasis()}"
													th:data-row-isActive="${ltype.isActive()}"
													data-toggle="modal" data-target="#modal_form_vertical">Edit</button>
												<button type="button" class="btn btn-danger btn-sm ml-1" th:attr="onclick='confirmDeleteLeaveType(' + ${ltype.getId()} + ');'">
													<i class="icon-trash"></i> Delete
												</button>
											</td>
										</tr>
									</th:block>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
			<!-- /content area -->

			<!-- Footer -->
			<div th:replace="fragments/common::footer"></div>

		</div>
		<!-- /main content -->

	</div>
	<!-- /page content -->

	<script th:inline="javascript">

		let contextRoot = /*[[${#httpServletRequest.getContextPath()}]]*/ '';

		$(document).ready(function() {
			$(".nav-item-submenu").removeClass("nav-item-expanded nav-item-open");
			$("#systemSettingsNav").addClass("nav-item-expanded nav-item-open");
			$("#leaveTypeNav").addClass("active");

			let msgCode = /*[[${uxmessage == null ? '' : uxmessage.code} ]]*/'';
			let msgDesc = /*[[${uxmessage == null ? '' : uxmessage.message}]]*/'';

			if(msgCode === 'ERROR'){
				notifyError(msgDesc);
			} else if (msgCode === 'SUCCESS') {
				notifySuccess(msgDesc);
			}

			$('#addLeaveTypeBtn').on('click', function() {
				$("#modal_form_vertical").find("#id").val('');
				$("#modal_form_vertical").find("#leaveTypeName").val('');
				$("#modal_form_vertical").find("#legalBasis").val('');
				$("#modal_form_vertical").find("#isActive").prop('checked', true);
			});
		});

		$('#table-list').DataTable({
				"lengthMenu": [10, 25, 50],
				"ordering": false,
		});

		$(document).on("click", ".showDetails", function() {
			var btn = $(this);
			$("#modal_form_vertical").find("#id").val(btn.attr('data-row-id'));
			$("#modal_form_vertical").find("#leaveTypeName").val(btn.attr('data-row-leaveTypeName'));
			$("#modal_form_vertical").find("#legalBasis").val(btn.attr('data-row-legalBasis'));
			$("#modal_form_vertical").find("#isActive").prop('checked', btn.attr('data-row-isActive') === 'true');
		});

		function confirmDeleteLeaveType(id) {
			swal({
				title: 'Delete Leave Type',
				text: 'Are you sure you want to delete this leave type? Existing applications keep their recorded type. This cannot be undone.',
				icon: 'warning',
				buttons: { cancel: 'Cancel', confirm: { text: 'Delete', value: true } },
				dangerMode: true,
			}).then(function(value) {
				if (value) {
					var form = document.getElementById('deleteLeaveTypeForm');
					form.action = contextRoot + '/delete-leave-type/' + id;
					form.submit();
				}
			});
		}

	</script>
</body>
</html>
